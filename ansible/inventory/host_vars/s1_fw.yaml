---
# =============================================================================
# S1-FW (pfSense) — full configuration data model.
# Consumed by the `firewall` role via playbooks/s1_fw.yaml.
# Mirrors docs/runbooks/site1.md / configs/firewall/site1.md.
# =============================================================================

# ---- Connection -------------------------------------------------------------
# pfSense modules run on the firewall itself over SSH, as the admin user (= root,
# so no become). Enable SSH in System > Advanced > Admin Access > Secure Shell,
# and add your public key to User Manager > admin > Authorized SSH Keys.
#
# Reached THROUGH the bastion (ProxyJump): the firewall's own OpenVPN rules only
# let the bastion (192.168.10.10, inter-sites rule) into the 10.0.1.0/24 LAN, not
# the Admin VPN segment directly. That's why `ping 10.0.1.254` from your laptop
# fails by design. `bastion` must resolve in your ~/.ssh/config.
ansible_host: 10.0.1.254            # pfSense LAN/mgmt IP (routed via the tunnel from the bastion)
ansible_user: admin
# Private key for hop 2 (bastion -> pfSense admin). The bastion hop uses your
# ~/.ssh/config IdentityFile. Set here so we don't fall back to ansible.cfg's key.
ansible_ssh_private_key_file: ~/.ssh/id_ed25519_NSA
ansible_ssh_common_args: "-o ProxyJump=bastion -o IdentitiesOnly=yes"
ansible_become: false
# Point at pfSense's bundled python. Verify the minor version on the box with:
#   ls /usr/local/bin/python3*
ansible_python_interpreter: /usr/local/bin/python3.11

# ---- System -----------------------------------------------------------------
fw_hostname: S1-FW
fw_domain: site1.internal

# NIC layout (confirmed): vtnet0 = WAN, vtnet1 = LAN (trunk carrying the VLANs).
# OPT1 = VLAN 10 on vtnet1 (SERVERS), OPT2 = VLAN 20 on vtnet1 (DATABASE).
fw_lan_parent: vtnet1

# ---- VLANs (Interfaces > Assignments > VLANs) -------------------------------
fw_vlans:
  - { vlan_id: 10, interface: "{{ fw_lan_parent }}", descr: SERVERS }
  - { vlan_id: 20, interface: "{{ fw_lan_parent }}", descr: DATABASE }

# ---- Interface assignments (OPT1 / OPT2) ------------------------------------
fw_interfaces:
  - descr: SERVERS
    interface: "{{ fw_lan_parent }}.10"
    enable: true
    ipv4_type: static
    ipv4_address: 10.0.10.254
    ipv4_prefixlen: 24
  - descr: DATABASE
    interface: "{{ fw_lan_parent }}.20"
    enable: true
    ipv4_type: static
    ipv4_address: 10.0.20.254
    ipv4_prefixlen: 24

# ---- Aliases (Firewall > Aliases > Ports) -----------------------------------
fw_aliases:
  - name: HTTPS_HTTP
    type: port
    address: "80 443"
    descr: HTTP and HTTPS ports

# ---- Firewall rules ---------------------------------------------------------
# One ordered list. The role places each rule after the previous one on the same
# interface, so list order == top-to-bottom order in the pfSense UI.
# destination "(self)" == "This Firewall". A trailing block rule = least privilege.
fw_rules:
  # --- WAN ---
  - name: "[EMERGENCY] Kill switch — Block all WAN (disabled by default)"
    interface: wan
    action: block
    source: any
    destination: any
    disabled: true        # enable only during an incident
  - name: "VPN — Tunnel OpenVPN site-to-site depuis S2-FW"
    interface: wan
    action: pass
    protocol: udp
    source: 5.196.45.7
    destination: "(self)"
    destination_port: "1195"
  - name: "Block — Refus de tout trafic WAN non autorisé"
    interface: wan
    action: block
    source: any
    destination: any

  # --- LAN (10.0.1.0/24, only pfSense lives here) ---
  - name: "Admin — Accès webUI pfSense depuis LAN"
    interface: lan
    action: pass
    protocol: tcp
    source: 10.0.1.0/24
    destination: "(self)"
    destination_port: "443"
  - name: "DNS — Résolution DNS depuis LAN via pfSense"
    interface: lan
    action: pass
    protocol: tcp/udp
    source: 10.0.1.0/24
    destination: "(self)"
    destination_port: "53"
  - name: "Block — Refus de tout trafic LAN non autorisé"
    interface: lan
    action: block
    source: any
    destination: any

  # --- OPT1 / SERVERS (VLAN 10) ---
  - name: "DNS — Résolution DNS App Server via pfSense"
    interface: SERVERS
    action: pass
    protocol: tcp/udp
    source: 10.0.10.0/24
    destination: "(self)"
    destination_port: "53"
  - name: "ICMP — Ping gateway pour diagnostic"
    interface: SERVERS
    action: pass
    protocol: icmp
    source: 10.0.10.0/24
    destination: "(self)"
  - name: "DB — App Server vers Database PostgreSQL"
    interface: SERVERS
    action: pass
    protocol: tcp
    source: 10.0.10.0/24
    destination: 10.0.20.0/24
    destination_port: "5432"
  - name: "Monitoring — Envoi logs App Server vers Elasticsearch S2"
    interface: SERVERS
    action: pass
    protocol: tcp
    source: 10.0.10.0/24
    destination: 192.168.20.0/24
    # TODO: tighten to the Beats/ES port once confirmed on S2-MT (5044 or 9200)
  - name: "HTTP/HTTPS — Mises à jour système App Server"
    interface: SERVERS
    action: pass
    protocol: tcp
    source: 10.0.10.0/24
    destination: any
    destination_port: HTTPS_HTTP
  - name: "Block — Refus de tout trafic OPT1 non autorisé"
    interface: SERVERS
    action: block
    source: any
    destination: any

  # --- OPT2 / DATABASE (VLAN 20) ---
  - name: "DB — App Server vers Database PostgreSQL"
    interface: DATABASE
    action: pass
    protocol: tcp
    source: 10.0.10.0/24
    destination: 10.0.20.0/24
    destination_port: "5432"
  - name: "DNS — Résolution DNS Database via pfSense"
    interface: DATABASE
    action: pass
    protocol: tcp/udp
    source: 10.0.20.0/24
    destination: "(self)"
    destination_port: "53"
  - name: "ICMP — Ping gateway pour diagnostic"
    interface: DATABASE
    action: pass
    protocol: icmp
    source: 10.0.20.0/24
    destination: "(self)"
  - name: "HTTP/HTTPS — Mises à jour système Database"
    interface: DATABASE
    action: pass
    protocol: tcp
    source: 10.0.20.0/24
    destination: any
    destination_port: HTTPS_HTTP
  - name: "Block — Refus de tout trafic OPT2 non autorisé"
    interface: DATABASE
    action: block
    source: any
    destination: any

  # --- OpenVPN (tunnel-side rules). Order is critical: the two SSH blocks must
  #     come before the inter-sites allow. ---
  - name: "Admin — Accès interface pfSense S1 depuis tunnel VPN"
    interface: openvpn
    action: pass
    protocol: tcp
    source: 172.16.0.0/30
    destination: "(self)"
    destination_port: "443"
  - name: "Admin — Accès webUI pfSense S1 depuis Admin VPN client"
    interface: openvpn
    action: pass
    protocol: tcp
    source: 192.168.100.0/24
    destination: "(self)"
    destination_port: "443"
  # NOT in the original runbook — added for Ansible mgmt over SSH. When you add it
  # by hand during the SSH bootstrap, use this exact description so the playbook
  # adopts it instead of creating a duplicate.
  - name: "Admin — SSH pfSense S1 depuis bastion (gestion Ansible)"
    interface: openvpn
    action: pass
    protocol: tcp
    source: 192.168.10.10/32
    destination: "(self)"
    destination_port: "22"
  - name: "Block — SSH direct depuis Admin VPN vers S1-APP (passer par bastion)"
    interface: openvpn
    action: block
    protocol: tcp
    source: 192.168.100.0/24
    destination: 10.0.10.0/24
    destination_port: "22"
  - name: "Block — SSH direct depuis Admin VPN vers S1-DB (passer par bastion)"
    interface: openvpn
    action: block
    protocol: tcp
    source: 192.168.100.0/24
    destination: 10.0.20.0/24
    destination_port: "22"
  - name: "SSH — Bastion S2-JS vers VMs Site 1"
    interface: openvpn
    action: pass
    protocol: tcp
    source: 192.168.10.10/32
    destination: 10.0.0.0/8
    destination_port: "22"
  - name: "Inter-sites — Trafic S2 vers réseau S1 via tunnel"
    interface: openvpn
    action: pass
    protocol: tcp/udp
    source: 192.168.0.0/16
    destination: 10.0.0.0/8
  - name: "Block — Refus de tout trafic tunnel non autorisé"
    interface: openvpn
    action: block
    source: any
    destination: any

# ---- DHCP servers (Services > DHCP Server) ----------------------------------
# Pool starts at .100; .1-.99 reserved for static hosts.
fw_dhcp_servers:
  - interface: SERVERS
    enable: true
    range_from: 10.0.10.100
    range_to: 10.0.10.200
    gateway: 10.0.10.254
    dnsserver: [10.0.10.254]
    domain: site1.internal
  - interface: DATABASE
    enable: true
    range_from: 10.0.20.100
    range_to: 10.0.20.200
    gateway: 10.0.20.254
    dnsserver: [10.0.20.254]
    domain: site1.internal

# ---- DNS Resolver (Services > DNS Resolver) ---------------------------------
fw_dns_resolver:
  state: present
  active_interface: [all]
  outgoing_interface: [all]
  dnssec: true
  forwarding: false          # MUST stay off for Domain Overrides to work over the VPN
  regdhcp: true
  regdhcpstatic: true
  hosts:
    - { host: app,      domain: site1.internal, ip: 10.0.10.1,   descr: App Server }
    - { host: db,       domain: site1.internal, ip: 10.0.20.1,   descr: Database Server }
    - { host: firewall, domain: site1.internal, ip: 10.0.10.254, descr: pfSense S1-FW }
  domainoverrides:
    - { domain: site2.internal, ip: 172.16.0.1, descr: Forward Site 2 queries to S2-FW via VPN }

# ---- OpenVPN site-to-site client (opt-in; see roles/firewall/tasks/openvpn.yml)
fw_manage_openvpn_client: false
fw_openvpn_client:
  name: S2S            # the existing client's description
  remote_network: "192.168.1.0/24,192.168.10.0/24,192.168.20.0/24,192.168.100.0/24"
  # ca: <existing CA name>      # fill these in before flipping fw_manage_openvpn_client
  # cert: <existing cert name>
  # server_addr: 5.196.45.7
  # server_port: 1195
  # protocol: udp
  # dev_mode: tun
