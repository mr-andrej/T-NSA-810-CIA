---
- name: Ensure vault.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/vault.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy systemd drop-in for resource limits
  ansible.builtin.template:
    src: vault-override.conf.j2
    dest: /etc/systemd/system/vault.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  register: vault_systemd_override

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: vault_systemd_override.changed

- name: Ensure Vault service is enabled and started
  ansible.builtin.systemd:
    name: vault
    enabled: true
    state: started
