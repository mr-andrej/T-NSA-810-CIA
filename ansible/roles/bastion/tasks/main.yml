- name: Create bastion admin user
  user:
    name: bastion
    shell: /bin/bash
    groups: sudo
    append: true
    state: present
    password: "*"

- name: Create .ssh directory for bastion user
  file:
    path: /home/bastion/.ssh
    state: directory
    owner: bastion
    group: bastion
    mode: "0700"

- name: Deploy authorized SSH public key for bastion user
  lineinfile:
    path: /home/bastion/.ssh/authorized_keys
    line: "{{ bastion_ssh_public_key }}"
    create: yes
    owner: bastion
    group: bastion
    mode: "0600"

- name: Allow bastion user to run sudo without password
  copy:
    content: "bastion ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/bastion
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Deploy hardened sshd_config
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Ensure SSH service is enabled and running
  service:
    name: ssh
    state: started
    enabled: true

- name: Create normal users on bastion
  user:
    name: "{{ item.name }}"
    shell: /bin/bash
    state: present
    password: "*"
  loop: "{{ bastion_users }}"

- name: Create .ssh directory for each user
  file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ bastion_users }}"

- name: Deploy PC public key for each user
  lineinfile:
    path: "/home/{{ item.name }}/.ssh/authorized_keys"
    line: "{{ item.pc_public_key }}"
    create: yes
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  loop: "{{ bastion_users }}"

- name: Generate SSH keypair for each user on bastion
  community.crypto.openssh_keypair:
    path: "/home/{{ item.name }}/.ssh/id_ed25519"
    type: ed25519
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
    force: false
  loop: "{{ bastion_users }}"

- name: Unlock user accounts for SSH key authentication
  command: usermod -p '*' "{{ item.name }}"
  loop: "{{ bastion_users }}"
  changed_when: false

- name: Deploy SSH client config for each user
  template:
    src: ssh_config.j2
    dest: "/home/{{ item.name }}/.ssh/config"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  loop: "{{ bastion_users }}"
